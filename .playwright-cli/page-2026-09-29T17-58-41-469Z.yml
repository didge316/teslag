              - paragraph [ref=e99]: When the pressure gets too high, retreat to the docks to explore the city by boat, customize your home to perfection, or master a high-stakes cyberpunk chess tournament. With a realistic weather system and a vibrant cast of characters to meet, “Nivalis Nights” offers a unique simulation where your path is entirely up to you.
